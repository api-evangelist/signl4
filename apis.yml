- aid: signl4:rest-api
  name: SIGNL4 REST API
  description: >-
    RESTful API for programmatic alert lifecycle management including creating events, acknowledging or
    closing alerts, annotating alerts, and retrieving team data. Authentication is via X-S4-Api-Key header
    with the team or webhook secret.
  humanURL: https://docs.signl4.com/integrations/rest-api/rest-api.html
