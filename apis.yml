apis:
- aid: signl4:inbound-webhook
  name: SIGNL4 Inbound Webhook API
  description: >-
    Simple HTTPS webhook endpoint for triggering mobile alerts in SIGNL4 from any monitoring, ITSM, or
    IoT tool. Accepts JSON payloads with Title and Message fields plus optional X-S4 control parameters
    for service categorization, location, alerting scenario, and external identifiers. Authentication
    uses a unique team or webhook secret embedded in the URL path.
  humanURL: https://docs.signl4.com/integrations/webhook/webhook.html
  baseURL: https://connect.signl4.com/webhook
  tags:
  - Webhook
